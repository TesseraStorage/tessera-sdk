[package]
name = "tessera_storage_wasm"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
description = "Browser bindings for the Tessera storage SDK"
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tessera_storage = { workspace = true }
sia_core = "=0.4.2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
wasm-streams = "0.6"
futures-util = { version = "0.3", default-features = false, features = ["io", "std"] }
web-sys = { version = "0.3", features = ["ReadableStream"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
chrono = "0.4"
hex = "0.4"
tokio = { version = "1", features = ["rt", "io-util", "sync"] }
tokio-util = { version = "0.7", features = ["compat"] }
console_error_panic_hook = "0.1"
log = "0.4"
serde = "1.0.229"
tsify = { version = "0.5", features = ["js"] }
