[changes]
ignore_conventional_commits = true

# Versions are inherited from `[workspace.package]` in the root Cargo.toml.
# The release workflow is disabled until publishing tokens exist.

[packages.tessera_storage]
versioned_files = [
    "Cargo.toml",
    "tessera_storage/Cargo.toml",
    { path = "tessera_storage_ffi/Cargo.toml", dependency = "tessera_storage" },
    { path = "tessera_storage_napi/Cargo.toml", dependency = "tessera_storage" },
    { path = "tessera_storage_napi/package.json" },
    { path = "tessera_storage_wasm/Cargo.toml", dependency = "tessera_storage" },
    { path = "tessera_storage_wasm/package.json" },
    { path = "Cargo.lock", dependency = "tessera_storage" },
]
changelog = "tessera_storage/CHANGELOG.md"

[packages.tessera_storage_ffi]
versioned_files = [
    "tessera_storage_ffi/Cargo.toml",
    { path = "Cargo.lock", dependency = "tessera_storage_ffi" },
]
changelog = "tessera_storage_ffi/CHANGELOG.md"

[packages.tessera_storage_napi]
versioned_files = [
    "tessera_storage_napi/Cargo.toml",
    "tessera_storage_napi/package.json",
    { path = "Cargo.lock", dependency = "tessera_storage_napi" },
]
changelog = "tessera_storage_napi/CHANGELOG.md"

[packages.tessera_storage_wasm]
versioned_files = [
    "tessera_storage_wasm/Cargo.toml",
    "tessera_storage_wasm/package.json",
    { path = "Cargo.lock", dependency = "tessera_storage_wasm" },
]
changelog = "tessera_storage_wasm/CHANGELOG.md"

[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"

[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows]]
name = "release"

[[workflows.steps]]
type = "Release"

[github]
owner = "TesseraStorage"
repo = "tessera-sdk"
