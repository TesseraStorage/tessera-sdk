[package]
name = "tessera_storage_napi"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
description = "Node.js N-API bindings for the Tessera storage SDK"
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
bytes = "1.12.1"
futures-core = "0.3.33"
log = "0.4.33"
chrono = { version = "0.4", features = ["serde"] }
napi = { version = "3.11.0", features = ["async", "napi8", "chrono_date", "web_stream"] }
napi-derive = { version = "3.6.0", features = ["type-def"] }
sia_core = "=0.4.2"
tessera_storage = { workspace = true, features = ["fs"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }

[build-dependencies]
napi-build = "2"
