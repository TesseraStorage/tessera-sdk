name: Main

on:
  push:
    branches:
      - tessera
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Setup Environment
        run: |
          rustup update stable
          rustup toolchain install nightly
          rustup target add wasm32-unknown-unknown
          rustup component add rustfmt --toolchain nightly
      - name: Rustfmt
        run: cargo +nightly fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features --workspace -- -D warnings
      - name: Clippy (wasm)
        run: cargo clippy --target wasm32-unknown-unknown --lib --tests --package tessera_storage --package tessera_storage_wasm --no-default-features -- -D warnings
      - name: Build docs
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  test:
    name: Test native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Setup Rust
        run: rustup update stable
      - name: Build benches
        run: cargo build --benches --features=mock
      - name: Test
        run: cargo test --all-features
      - name: Check feature combinations
        run: |
          cargo check -p tessera_storage --all-targets
          cargo check -p tessera_storage --all-targets --features=mock
          cargo check -p tessera_storage --all-targets --features=less-safe-crypto
          cargo check -p tessera_storage --all-targets --features=fs

  test-wasm:
    name: Test WASM (${{ matrix.runtime }})
    strategy:
      fail-fast: false
      matrix:
        runtime: [chrome, firefox, node]
    runs-on: ubuntu-latest
    env:
      WASM_BINDGEN_TEST_TIMEOUT: '300'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Setup Environment
        run: |
          rustup update stable
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack
      - name: Configure runtime
        run: |
          if [ "${{ matrix.runtime }}" = "node" ]; then
            echo "WASM_FLAGS=--node" >> "$GITHUB_ENV"
          else
            echo "WASM_FLAGS=--headless --${{ matrix.runtime }}" >> "$GITHUB_ENV"
            echo "WASM_BINDGEN_USE_BROWSER=1" >> "$GITHUB_ENV"
          fi
      - name: Test tessera_storage
        run: cd tessera_storage && wasm-pack test --release $WASM_FLAGS -- --lib

  # Single required check for branch protection. Skipped (and therefore
  # non-passing) whenever any upstream job fails.
  success:
    name: success
    needs: [lint, test, test-wasm]
    runs-on: ubuntu-latest
    steps:
      - run: echo success
