name: Release

on:
  pull_request:
    types: [closed]
    branches: [tessera]

permissions:
  contents: write

jobs:
  # Disabled until CARGO_REGISTRY_TOKEN and NPM_TOKEN are configured.
  # When this is turned back on, publish only the Tessera crate and the
  # @tessera-storage npm packages. Do not publish sia_core, sia_core_derive,
  # sia_mux, or any @siafoundation package.
  release:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - name: Setup Environment
        run: |
          rustup update stable
          cargo install knope
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: knope release
      - name: Publish Crates
        if: false
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for crate in tessera_storage; do
            output=$(cargo publish -p "$crate" --registry crates-io 2>&1) && {
              echo "Published $crate"
            } || {
              if echo "$output" | grep -q "already exists"; then
                echo "Skipping $crate (already published)"
              else
                echo "$output" >&2
                exit 1
              fi
            }
          done
      - name: Publish npm packages
        if: false
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "npm publish stays off until @tessera-storage/sdk and @tessera-storage/sdk-wasm are ready"
