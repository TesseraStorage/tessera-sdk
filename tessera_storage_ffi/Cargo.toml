[package]
name = "tessera_storage_ffi"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
description = "FFI bindings for the Tessera storage SDK"
authors.workspace = true
categories = ["cryptography::cryptocurrencies"]
keywords = ["tessera", "sia", "storage", "decentralized", "depin"]
publish = false

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
async-trait = "0.1.91"
tessera_storage = { workspace = true, features = ["fs"] }
log = "0.4.33"
rand = "0.10.2"
sia_core = "=0.6.1"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync"] }
tokio-util = "0.7.19"
uniffi = { version = "0.32.2", features = ["cli", "tokio"] } # be careful updating as it may break uniffi-react-native-bindgen
zeroize = "1.9.0"


[build-dependencies]
uniffi = { version = "0.32.2", features = ["build"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "io-util"] }

[[bin]]
name = "uniffi-bindgen"

[features]
mock = []
